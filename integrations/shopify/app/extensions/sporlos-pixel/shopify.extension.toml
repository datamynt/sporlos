# Web Pixel-app-extension for Sporløs (Fase 2).
# Genereres normalt av `shopify app generate extension --template web_pixel`;
# håndskrevet her så kjernen er klar. `shopify app deploy` validerer formatet —
# regenerér via CLI hvis den klager (skjemaet kan drifte mellom CLI-versjoner).
api_version = "2026-01"

[[extensions]]
name = "Sporløs"
handle = "sporlos-pixel"
type = "web_pixel_extension"
# Stabil app-scoped id (CLI bruker den til create/update). Generert v4-UUID.
uid = "aa67f563-37e2-4b5d-9bb9-d376e83dc12d"
# strict sandbox: ingen direkte document/window — alt leses fra event.context.
runtime_context = "strict"

# Personvern-deklarasjon (Shopifys Customer Privacy API). Sporløs er analyse uten PII
# og SELGER ALDRI data → sale_of_data = "disabled". analytics = true: pixelen fyrer når
# analyse-samtykke er gitt. (NB: vi mener selv produktet ikke UTLØSER samtykkekrav siden
# det ikke lagrer på enheten — men innenfor Shopifys rammeverk deklarerer vi intensjonen
# ærlig. Se README → consent-nyansen.)
  [extensions.customer_privacy]
  analytics = true
  marketing = false
  preferences = false
  sale_of_data = "disabled"

# Kjøpmann-innstillinger. Eneste støttede felttype for web-pixel er single_line_text_field.
  [extensions.settings]
  type = "object"

    [extensions.settings.fields.site_id]
    name = "Sporløs site-ID"
    description = "Finn den i sporlos.no/app under «Vis sporings-kode» (f.eks. 6LIACtOSP-S7)."
    type = "single_line_text_field"

    [extensions.settings.fields.endpoint]
    name = "Sporløs-server"
    description = "La stå tom for sporlos.no. Self-hostere: https://analytics.dittdomene.no/api/event"
    type = "single_line_text_field"
