name: deploy

# MANUELL deploy (workflow_dispatch). Auto-deploy-på-push er flyttet til b550 sin
# pull-loop (scripts/deploy-b550.sh via cron): b550 har ikke åpen SSH utad, så
# push-fra-GitHub-runner nådde den aldri. Behold denne for en evt. fremtidig
# SSH-bar norsk-eid VPS — sett DEPLOY_HOST-secreten til den boksen først.
# SSH-nøkkelen er låst til ett forced command på serveren (kun redeploy, ingen shell).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH (git pull + compose up --build)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "root@${DEPLOY_HOST}" true
