# Prod-stack for en liten norsk-eid VPS (f.eks. PRO ISP): Postgres + app + Caddy (auto-HTTPS).
#   cp .env.example .env   # fyll inn SPORLOS_DOMAIN, SPORLOS_SALT_SECRET, POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app python -m app.manage init
# Se DEPLOY.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sporlos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sporlos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporlos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # Hele .env injiseres automatisk (alle hemmeligheter: SALT/SESSION/DOMAIN/
    # STRIPE_*/GOOGLE_*/VIPPS_*/STRIPE_MODE). Da kan ingen variabel "glippe".
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sporlos:${POSTGRES_PASSWORD}@db:5432/sporlos
      SPORLOS_HTTPS: "true"
      GEOIP_DB: /data/geoip.mmdb
    volumes:
      # Lokal geo-DB (DB-IP Lite City, CC-BY). Mangler den → geo degraderer pent.
      - ./geoip:/data:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPORLOS_DOMAIN: ${SPORLOS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
